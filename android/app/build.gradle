plugins {
    id 'com.android.application'
}

// La app web vive en la raíz del repositorio; aquí se copia dentro del APK.
def webAssets = layout.buildDirectory.dir('webAssets').get().asFile

tasks.register('copyWeb', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'css/**', 'js/**', 'icons/**'
    }
    into new File(webAssets, 'www')
}

android {
    namespace 'com.isax.miingles'
    compileSdk 34

    defaultConfig {
        applicationId 'com.isax.miingles'
        minSdk 24
        targetSdk 34
        // Cada compilación en GitHub sube el número, para que se instale encima de la anterior.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.1'
    }

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += [webAssets]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.named('preBuild') {
    dependsOn 'copyWeb'
}
