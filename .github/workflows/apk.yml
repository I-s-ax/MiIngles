name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MiIngles.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MiIngles-apk
          path: MiIngles.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk \
            --title "MiInglés para Android" \
            --notes "APK más reciente. Se actualiza solo con cada cambio en main." \
            --target "$GITHUB_SHA"
          gh release upload apk MiIngles.apk --clobber
